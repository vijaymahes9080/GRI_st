name: Backend CI/CD Deployment Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'

jobs:
  test-and-deploy:
    name: Backend Test, Docker Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests/test_api.py

      - name: Build Docker Container
        run: |
          docker build -t gri-backend:latest ./backend

      - name: Deploy Notification
        run: echo "Backend container built & ready for Kubernetes / Cloud deployment"
