version: '3.8'

# GRI Open-Source & Free Tier Infrastructure Compose for Coolify PaaS

services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_HOST=supabase_db
      - REDIS_HOST=redis_cache
      - MINIO_ENDPOINT=minio_storage:9000
    depends_on:
      - supabase_db
      - redis_cache
      - minio_storage

  supabase_db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: gri_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gri_prod_pass_2026}
      POSTGRES_DB: gri_db
    volumes:
      - db_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning

  minio_storage:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_pass_2026}
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.0.0
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  db_data:
  minio_data:
